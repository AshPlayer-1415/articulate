name: Cross-platform verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.23.4', '24.22.2', '26.13.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run test:boundary
      - run: npm run build
      - run: npm run test:distribution
      - run: npm run test:resilience
      - run: npm run test:cursor-transport
        if: matrix.node == '24.22.2'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: distribution-${{ matrix.os }}-${{ matrix.node }}
          path: |
            artifacts/distribution-report.json
            artifacts/resilience-report.json
            artifacts/cursor-transport-report.json
          if-no-files-found: ignore
